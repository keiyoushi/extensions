name: Sync Repo Branch with Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 5/15 * *' 

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo Branch
        uses: actions/checkout@v4
        with:
          # Checa o branch 'repo'
          ref: repo
          fetch-depth: 0
          # O token é necessário para o push forçado
          token: ${{ secrets.GITHUB_TOKEN }} 

      # NOVO PASSO: Configura a Identidade do Git para o Runner
      - name: Configure Git User
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          
      - name: Set Up Upstream Remote
        run: |
          git remote add upstream https://github.com/keiyoushi/extensions.git

      - name: Fetch Upstream and Sync
        run: |
          git fetch upstream
          
          # Garante que estamos na branch correta
          git checkout repo
          
          # Tenta o rebase com a branch principal do upstream (geralmente main)
          # Se o upstream usar 'repo' como nome de branch, mantenha upstream/repo
          git rebase upstream/main || (echo "Conflito detectado - abortando" && exit 1)
          
      - name: Push Changes to 'repo' Branch
        run: |
          # Usamos --force porque o rebase altera a árvore de commits
          git push origin repo --force